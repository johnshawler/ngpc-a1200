# Checks the tools on every push, and builds and benches the port when the game's image is present.
# The image is copyrighted and this repository is public, so on GitHub only the first job runs: the bench
# runs where the image is (tools/port.sh fast locally). The same script is the referee: tools/port.sh
name: bench
on: [push, pull_request, workflow_dispatch]
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The kit is unchanged
        run: tools/check_kit.sh
      - name: The brief's rules (an approved plan and class, nothing from "Never do these")
        run: python3 tools/check_rules.py port.conf
      - name: Decoder and assembler agree (TLCS-900/H)
        run: python3 tools/ngpref/test_asm.py
      - name: The reference machine, the port's machine and its sound player compile without warnings
        run: |
          cc -O2 -Wall -Wextra -Werror -o /tmp/ngpref tools/ngpref/ngpref.c src/ngpc/k2ge.c
          cc -O2 -Wall -Wextra -Werror -Isrc/ngpc -Isrc -c src/ngpc/ngp.c -o /tmp/ngp.o
          for f in psg sndplay unlzma; do cc -O2 -Wall -Wextra -Werror -Isrc/ngpc -Isrc -c src/ngpc/$f.c -o /tmp/$f.o; done
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Is the game's image here?
        id: rom
        run: |
          . ./port.conf
          if ls original/$GAME.* >/dev/null 2>&1; then echo "have=1" >> "$GITHUB_OUTPUT"; else echo "no original/$GAME image: bench skipped (it is never committed)"; fi
      - name: Install the emulator and the compiler
        if: steps.rom.outputs.have == '1'
        timeout-minutes: 20
        run: tools/setup.sh
      - name: Build, bench and check the gates
        if: steps.rom.outputs.have == '1'
        run: tools/make_assets_ngpc.sh && tools/port.sh fast
      - name: Keep the evidence
        if: always() && steps.rom.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            bench_fast.txt
            shot_fast.png
          if-no-files-found: ignore
