# port.conf - describes this Neo Geo Pocket Color port (Neo Turf Masters) to tools/port.sh and to CI.
# port.ngpc.conf is the template tools/new_port_ngpc.sh starts the next port from. Shell syntax: no spaces around "=".
# Before the first build run tools/make_assets_ngpc.sh: it makes assets/, dist/rom.bin and src/ngpc/gen_* from
# original/$GAME.ngc (and original/bios.ngp, if you have it).

GAME=ntm                                    # the ROM is original/$GAME.ngc, its knowledge tools/games/$GAME.py
NAME=ntm                                    # program name inside dist/
GEN="src/ngpc/gen_dispatch.c src/ngpc/gen_ops.c src/ngpc/gen_00.c src/ngpc/gen_01.c src/ngpc/gen_02.c src/ngpc/gen_03.c src/ngpc/gen_04.c src/ngpc/gen_05.c src/ngpc/gen_06.c src/ngpc/gen_07.c src/ngpc/gen_08.c"
BACKEND=${BACKEND:-68k}                     # 68k: the Amiga runs src/ngpc/gen68k.s (tools/back900.py); c: the C translation
if [ "$BACKEND" = 68k ]; then AMIGA_GEN="src/ngpc/run68k.c src/ngpc/gen_ops.c src/ngpc/gen68k.s"; else AMIGA_GEN="src/ngpc/run_c.c $GEN"; fi
SOURCES="kit/sys.c kit/disp.c kit/perf.c kit/c2p/c2p1x1_8_c5_gen.s src/ngpc/main.c src/ngpc/logic.c src/ngpc/ngp.c src/ngpc/k2ge.c src/ngpc/psg.c src/ngpc/sndplay.c src/ngpc/sound_ngp.c src/ngpc/unlzma.c src/coro.s $AMIGA_GEN"
CFLAGS="-Ikit -Isrc/ngpc -Isrc -fno-strict-aliasing"   # registers are reached as bytes and words of a long

TICKS=3600                                  # logic ticks (Neo Geo Pocket frames) for the bench
CLASS=planar                                # a 2D tile and sprite game (BRIEF.md Step 1); perpixel only with the user's approval (tools/check_rules.py)

HOST_TEST="src/ngpc/host_test.c src/ngpc/logic.c src/ngpc/ngp.c src/ngpc/k2ge.c src/ngpc/run_c.c src/coro_host.c $GEN"
HOST_CFLAGS="-Isrc/ngpc -Isrc -fno-strict-aliasing"
