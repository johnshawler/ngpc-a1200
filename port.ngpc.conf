# port.ngpc.conf - describes a Neo Geo Pocket Color port to tools/port.sh. tools/new_port_ngpc.sh copies it to
# port.conf with the game's name. Shell syntax: no spaces around "=".
# Before the first build run tools/make_assets_ngpc.sh: it makes assets/, dist/rom.bin and src/ngpc/gen_* from
# original/$GAME.ngc (and original/bios.ngp, if you have it).

GAME=ntm                                    # the ROM is original/$GAME.ngc, its knowledge tools/games/$GAME.py
NAME=ntm                                    # program name inside dist/
GEN="src/ngpc/gen_dispatch.c src/ngpc/gen_00.c src/ngpc/gen_01.c src/ngpc/gen_02.c src/ngpc/gen_03.c src/ngpc/gen_04.c src/ngpc/gen_05.c"
SOURCES="kit/sys.c kit/disp.c kit/perf.c kit/c2p/c2p2x1_8_c5_gen.s src/ngpc/main.c src/ngpc/logic.c src/ngpc/ngp.c src/ngpc/k2ge.c src/ngpc/run_c.c src/coro.s $GEN"
CFLAGS="-Ikit -Isrc/ngpc -Isrc -fno-strict-aliasing"   # registers are reached as bytes and words of a long

TICKS=3600                                  # logic ticks (Neo Geo Pocket frames) for the bench
CLASS=perpixel                              # the first display computes every pixel: no 50 Hz gate yet. A finished
                                            # port has a planar display and CLASS=planar (PLAYBOOK-NGPC.md section 7)

HOST_TEST="src/ngpc/host_test.c src/ngpc/logic.c src/ngpc/ngp.c src/ngpc/k2ge.c src/ngpc/run_c.c src/coro_host.c $GEN"
HOST_CFLAGS="-Isrc/ngpc -Isrc -fno-strict-aliasing"
